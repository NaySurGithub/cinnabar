name: Mod navigation
on:
  push:
    branches: [mod-navigation-api]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: mod-navigation-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - id: verifier-cache
        uses: actions/cache/restore@v5
        with:
          key: navigation-linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: navigation-linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          path: target
      - name: Restore source timestamps
        env:
          CACHE_WORKSPACE: .
        run: python3 .github/actions/build-cache/cache.py restore-inputs
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check boundaries
        run: cargo run -p architecture --locked -- check --root . --policy tools/architecture/policy.toml
      - name: Test domain and host behavior
        run: cargo test --locked -p semantic-input -p sim -p mod-host --lib
      - name: Test multiple loaded mods
        run: cargo test --locked -p client-extensions --lib
      - name: Check client adapters and tests
        run: cargo check --locked -p cinnabar --tests
      - name: Test client adapters
        run: cargo test --locked -p cinnabar --lib -- modding
      - name: Lint changed packages
        run: cargo clippy --locked -p semantic-input -p sim -p mod-host -p client-extensions -p cinnabar --all-targets -- -D warnings
      - name: Verify cached inputs
        if: ${{ always() && !cancelled() }}
        env:
          CACHE_WORKSPACE: .
        run: python3 .github/actions/build-cache/cache.py verify-inputs
      - name: Retain compiler outputs
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.verifier-cache.outputs.cache-primary-key }}
          path: target
