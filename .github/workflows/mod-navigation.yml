name: Mod navigation
on:
  push:
    branches: [mod-navigation-api]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: mod-navigation-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: ./.github/actions/build-cache
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check boundaries
        run: cargo run -p architecture --locked -- check --root . --policy tools/architecture/policy.toml
      - name: Test domain and host behavior
        run: cargo test --locked -p semantic-input -p sim -p mod-host --lib
      - name: Test multiple loaded mods
        run: cargo test --locked -p client-extensions --features local-mods --lib
      - name: Check client adapters and tests
        run: cargo check --locked -p cinnabar --features local-mods --tests
      - name: Test client adapters
        run: cargo test --locked -p cinnabar --features local-mods --lib -- modding
      - name: Lint changed packages
        run: cargo clippy --locked -p semantic-input -p sim -p mod-host -p client-extensions -p cinnabar --features cinnabar/local-mods,client-extensions/local-mods --all-targets -- -D warnings
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: ./.github/actions/build-cache
        with:
          lane: release
      - name: Install packaging tools
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          choco install imagemagick make --no-progress -y
          $magick = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Directory | Select-Object -First 1
          if (-not $magick) { throw "ImageMagick not found" }
          Add-Content $env:GITHUB_PATH $magick.FullName
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          Add-Content $env:GITHUB_PATH "$env:ProgramData\chocolatey\bin"
      - name: Build runtime with local mods
        run: make package-binaries
      - name: Build installer
        shell: pwsh
        run: |
          & ./packaging/windows/build-installer.ps1 -Root $env:GITHUB_WORKSPACE
      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: mod-navigation-windows
          path: |
            .local/dist/windows-release/*-x64.msi
            .local/dist/windows-release/*-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
