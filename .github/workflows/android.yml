name: Android APK (experimental)

on:
  pull_request:
    branches: [dev]
    paths:
      - app/**
      - crates/**
      - core/**
      - tools/localserver/**
      - packaging/android/**
      - packaging/icons/**
      - assets/**
      - THIRD_PARTY_NOTICES.md
      - rust-toolchain.toml
      - go.work
      - go.work.sum
      - .github/workflows/android.yml
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [dev, 'android/**', 'codex/android-*']
    paths:
      - app/**
      - crates/**
      - core/**
      - tools/localserver/**
      - packaging/android/**
      - packaging/icons/**
      - assets/**
      - THIRD_PARTY_NOTICES.md
      - rust-toolchain.toml
      - go.work
      - go.work.sum
      - .github/workflows/android.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build (arm64 for phones; x86_64 for emulator checks)
        default: arm64-v8a
        type: choice
        options: [arm64-v8a, x86_64]
      apk_run:
        description: Existing APK run ID to smoke-test instead of building (optional)
        default: ''
        type: string
      server:
        description: Optional server address for an offline smoke join
        default: ''
        type: string
      home_play:
        description: 'Optional observed home Play tap x,y@WIDTHxHEIGHT for emulator smoke'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && inputs.apk_run != '' && 'smoke-' || '' }}${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  GOMAXPROCS: 2
  GOFLAGS: -p=2

jobs:
  apk:
    if: github.event_name != 'workflow_dispatch' || inputs.apk_run == ''
    name: Build signed test APK (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.abi)) || fromJSON('["arm64-v8a", "x86_64"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            tools/localserver/go.sum
            go.work.sum
      - name: Resolve the pinned Android toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          runtime = json.load(open('packaging/android/runtime.json'))
          for env, key in [('ANDROID_API', 'target_sdk'), ('ANDROID_BUILD_TOOLS', 'build_tools'), ('ANDROID_NDK_VERSION', 'ndk'), ('CARGO_NDK_VERSION', 'cargo_ndk')]:
              print(f'{env}={runtime[key]}')
          PY
      - name: Set up the pinned Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}
      - name: Install Rust and APK tooling
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y librsvg2-bin
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
          cache-on-failure: true
      - name: Restore the development preview signing key
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ.get('ANDROID_PREVIEW_KEYSTORE_BASE64', '')
          if encoded:
              keystore = Path('.local/android/test.keystore')
              keystore.parent.mkdir(parents=True, exist_ok=True)
              keystore.write_bytes(base64.b64decode(encoded, validate=True))
              keystore.chmod(0o600)
          PY
      - name: Build and verify APK payload and signature
        run: python3 packaging/android/build.py --abi "${{ matrix.abi }}" --profile play
      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinnabar-Android-${{ matrix.abi }}
          path: target/android/${{ matrix.abi }}/*-test.apk
          if-no-files-found: error
          retention-days: 14
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.apk_run != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/android-smoke.yml
    with:
      apk_run: ${{ inputs.apk_run }}
      server: ${{ inputs.server }}
      home_play: ${{ inputs.home_play }}
